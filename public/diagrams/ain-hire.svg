<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title description">
  <title id="title">AIN Hire architecture</title>
  <desc id="description">Candidate voice input flows through a bounded interview state machine, transcript scoring, evidence storage, and a recruiter review dashboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0e7490" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="520" rx="24" fill="#f8fafc" />
  <text x="64" y="62" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0e7490">CONTROLLED AI WORKFLOW</text>
  <text x="64" y="96" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Conversation and evaluation stay separate</text>

  <g filter="url(#shadow)">
    <rect x="64" y="166" width="168" height="154" rx="18" fill="#ffffff" stroke="#cbd5e1" />
    <circle cx="148" cy="207" r="22" fill="#cffafe" />
    <path d="M148 194v26m-10-13h20" stroke="#0e7490" stroke-width="3" stroke-linecap="round" />
    <text x="148" y="259" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Candidate</text>
    <text x="148" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Consent · Voice · STT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="292" y="142" width="238" height="202" rx="18" fill="#ecfeff" stroke="#67e8f9" />
    <text x="411" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164e63">Interview Controller</text>
    <rect x="324" y="207" width="174" height="36" rx="18" fill="#ffffff" stroke="#a5f3fc" />
    <text x="411" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#155e75">Bounded state machine</text>
    <rect x="324" y="255" width="174" height="36" rx="18" fill="#ffffff" stroke="#a5f3fc" />
    <text x="411" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#155e75">Role-play · Probing · TTS</text>
    <text x="411" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Conversation only</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="590" y="142" width="166" height="202" rx="18" fill="#f0fdf4" stroke="#86efac" />
    <text x="673" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Scorer</text>
    <text x="673" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">Pinned model</text>
    <text x="673" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">Validated schema</text>
    <text x="673" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">Evidence quotes</text>
    <text x="673" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">Knockout rules</text>
    <text x="673" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Post-interview only</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="816" y="166" width="104" height="154" rx="18" fill="#fff7ed" stroke="#fdba74" />
    <text x="868" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7c2d12">Recruiter</text>
    <text x="868" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">Review</text>
    <text x="868" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">Evidence</text>
    <text x="868" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9a3412">Sign off</text>
  </g>

  <path d="M232 243H280" stroke="#0e7490" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M530 243H578" stroke="#0e7490" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M756 243H804" stroke="#0e7490" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="292" y="394" width="464" height="64" rx="16" fill="#0f172a" />
  <text x="524" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">AUDIT TRAIL</text>
  <text x="524" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a5f3fc">Transcript · Audio · Scores · Evidence · Review actions</text>
  <path d="M411 344V383" stroke="#0e7490" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M673 344V383" stroke="#0e7490" stroke-width="3" marker-end="url(#arrow)" />
</svg>
